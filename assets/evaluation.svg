<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><rect width="100%" height="100%" fill="white"/><text x="45" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">Evidence boundary</text><rect x="55" y="90" width="1090" height="68" rx="10" fill="#f8f8f8" stroke="#444"/><text x="80" y="117" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Supported</text><text x="80" y="141" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Maintenance-intent composition differs materially across sampled Apache projects.</text><rect x="55" y="182" width="1090" height="68" rx="10" fill="#f8f8f8" stroke="#444"/><text x="80" y="209" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Robustness</text><text x="80" y="233" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Cramér's V stays near 0.30 after excluding increasingly small project samples.</text><rect x="55" y="274" width="1090" height="68" rx="10" fill="#f8f8f8" stroke="#444"/><text x="80" y="301" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Taxonomy</text><text x="80" y="325" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Perfective/corrective/other are source categories—not two independent binary outcomes.</text><rect x="55" y="366" width="1090" height="68" rx="10" fill="#f8f8f8" stroke="#444"/><text x="80" y="393" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Boundary</text><text x="80" y="417" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Commit intent is not requirements churn, design propagation, rework cost, or causal project performance.</text></svg>