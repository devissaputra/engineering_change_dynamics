<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="100%" height="100%" fill="#ffffff"/><text x="55" y="50" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Evidence boundary and released findings</text><rect x="55" y="100" width="1090" height="96" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="73" y="131" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1d4ed8">Observed composition</text><text x="73" y="157" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Perfective 40.3% • Corrective 27.0% • Other 32.6% across 2,533 manually classified commits.</text><rect x="55" y="220" width="1090" height="96" rx="15" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="73" y="251" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#15803d">Cross-project heterogeneity</text><text x="73" y="277" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Primary n ≥ 20 analysis: χ²(84)=432.452 • Cramér's V=0.302 • no expected cells below 5.</text><rect x="55" y="340" width="1090" height="96" rx="15" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/><text x="73" y="371" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#9a3412">Robustness and drivers</text><text x="73" y="397" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">V remains 0.293 to 0.305 across thresholds; Phoenix, PDFBox, Commons Math, Commons Lang, and Tez are major contributors.</text><rect x="55" y="460" width="1090" height="96" rx="15" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="73" y="491" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#991b1b">Claim boundary</text><text x="73" y="517" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Maintenance intent is not project quality, causality, requirements churn, rework cost, schedule impact, or temporal dynamics.</text><text x="55" y="630" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#334155">Engineering interpretation: portfolio averages should not be assumed to describe each project's local maintenance profile.</text></svg>