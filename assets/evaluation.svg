<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><ns0:rect width="100%" height="100%" fill="white" /><ns0:text x="50" y="55" font-family="Arial" font-size="29" font-weight="700">Engineering Change Dynamics — Evidence Boundary</ns0:text><ns0:rect x="55" y="95" width="1090" height="170" rx="18" fill="#f6f6f6" stroke="#333" /><ns0:text x="85" y="133" font-family="Arial" font-size="20" font-weight="700">Empirical finding</ns0:text><ns0:text x="85" y="167" font-family="Arial" font-size="16">Among 2,533 manually classified commits, 40.3% are internal-quality changes, 27.0% external-quality changes, and</ns0:text><ns0:text x="85" y="191" font-family="Arial" font-size="16">32.6% neither. Project-level internal-quality shares range from 0.130 to 0.818, demonstrating strong</ns0:text><ns0:text x="85" y="215" font-family="Arial" font-size="16">heterogeneity in observed change orientation.</ns0:text><ns0:rect x="55" y="300" width="1090" height="170" rx="18" fill="#f6f6f6" stroke="#333" /><ns0:text x="85" y="338" font-family="Arial" font-size="20" font-weight="700">Claim boundary</ns0:text><ns0:text x="85" y="372" font-family="Arial" font-size="16">Commit intent is not equivalent to requirement change, design rework, or downstream cost/schedule impact. The</ns0:text><ns0:text x="85" y="396" font-family="Arial" font-size="16">empirical title is intentionally narrower: claims concern coded change orientation in this sample of Apache</ns0:text><ns0:text x="85" y="420" font-family="Arial" font-size="16">projects.</ns0:text></ns0:svg>