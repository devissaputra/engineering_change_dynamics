<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="100%" height="100%" fill="#ffffff"/><text x="55" y="50" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Reproducible cross-project heterogeneity pipeline</text><text x="55" y="80" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#475569">The pipeline preserves the source taxonomy, separates description from inference, and exposes the projects driving the omnibus pattern.</text><rect x="45" y="135" width="205" height="125" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="63" y="166" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1d4ed8">1 • Zenodo source</text><text x="63" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">manual_labels.csv</text><text x="63" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">2,533 commits</text><text x="63" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">54 projects</text><rect x="290" y="135" width="205" height="125" rx="15" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/><text x="308" y="166" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#6d28d9">2 • Taxonomy check</text><text x="308" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Perfective</text><text x="308" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Corrective</text><text x="308" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Other only</text><rect x="535" y="135" width="205" height="125" rx="15" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="553" y="166" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#15803d">3 • Project profiles</text><text x="553" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Counts + shares</text><text x="553" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Wilson intervals</text><rect x="780" y="135" width="205" height="125" rx="15" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/><text x="798" y="166" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#92400e">4 • Primary inference</text><text x="798" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Projects n ≥ 20</text><text x="798" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">χ² + Cramér's V</text><line x1="250" y1="198" x2="278" y2="198" stroke="#64748b" stroke-width="2"/><polygon points="278,192 290,198 278,204" fill="#64748b"/><line x1="495" y1="198" x2="523" y2="198" stroke="#64748b" stroke-width="2"/><polygon points="523,192 535,198 523,204" fill="#64748b"/><line x1="740" y1="198" x2="768" y2="198" stroke="#64748b" stroke-width="2"/><polygon points="768,192 780,198 768,204" fill="#64748b"/><rect x="780" y="335" width="205" height="135" rx="15" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/><text x="798" y="366" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#4338ca">5 • Sensitivity</text><text x="798" y="392" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">n ≥ 10 / 20 / 30</text><text x="798" y="413" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">40 / 50</text><text x="798" y="434" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Track V stability</text><line x1="882" y1="260" x2="870" y2="335" stroke="#6366f1" stroke-width="2"/><polygon points="870,329 882,335 870,341" fill="#6366f1"/><rect x="505" y="335" width="225" height="135" rx="15" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="523" y="366" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#991b1b">6 • Cell diagnostics</text><text x="523" y="392" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Primary residuals</text><text x="523" y="413" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Observed vs expected</text><text x="523" y="434" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">No separate p claims</text><line x1="780" y1="402" x2="718" y2="402" stroke="#ef4444" stroke-width="2"/><polygon points="718,396 730,402 718,408" fill="#ef4444"/><rect x="230" y="335" width="225" height="135" rx="15" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/><text x="248" y="366" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#0e7490">7 • Project contribution</text><text x="248" y="392" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Sum cell χ² terms</text><text x="248" y="413" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Explain omnibus result</text><text x="248" y="434" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">No quality ranking</text><line x1="505" y1="402" x2="443" y2="402" stroke="#06b6d4" stroke-width="2"/><polygon points="443,396 455,402 443,408" fill="#06b6d4"/><rect x="230" y="540" width="755" height="105" rx="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="248" y="571" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#334155">8 • Bounded interpretation</text><text x="248" y="597" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Portfolio average can hide local maintenance profiles</text><text x="248" y="618" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">No causal, temporal, cost, schedule, or quality ranking claim</text><line x1="342" y1="470" x2="330" y2="540" stroke="#06b6d4" stroke-width="2"/><polygon points="330,534 342,540 330,546" fill="#06b6d4"/><line x1="618" y1="470" x2="606" y2="540" stroke="#ef4444" stroke-width="2"/><polygon points="606,534 618,540 606,546" fill="#ef4444"/><line x1="882" y1="470" x2="870" y2="540" stroke="#6366f1" stroke-width="2"/><polygon points="870,534 882,540 870,546" fill="#6366f1"/><text x="55" y="700" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#334155">Scientific safeguard: the n ≥ 20 primary restriction is explicit, while full-table and stricter thresholds remain visible as sensitivity evidence.</text></svg>