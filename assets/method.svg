<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="100%" height="100%" fill="white"/><text x="45" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">Method</text><circle cx="75" cy="135" r="23" fill="#f0f0f0" stroke="#333"/><text x="75" y="141" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">1</text><rect x="120" y="105" width="1020" height="62" rx="10" fill="#fafafa" stroke="#444"/><text x="145" y="143" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Map source flags to perfective, corrective, or other; reject impossible both=True rows.</text><circle cx="75" cy="230" r="23" fill="#f0f0f0" stroke="#333"/><text x="75" y="236" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">2</text><rect x="120" y="200" width="1020" height="62" rx="10" fill="#fafafa" stroke="#444"/><text x="145" y="238" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Compute complete 54-project category counts, shares, and 95% Wilson intervals.</text><circle cx="75" cy="325" r="23" fill="#f0f0f0" stroke="#333"/><text x="75" y="331" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">3</text><rect x="120" y="295" width="1020" height="62" rx="10" fill="#fafafa" stroke="#444"/><text x="145" y="333" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Use n≥20 projects for primary χ² inference so all expected counts exceed 5.</text><circle cx="75" cy="420" r="23" fill="#f0f0f0" stroke="#333"/><text x="75" y="426" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">4</text><rect x="120" y="390" width="1020" height="62" rx="10" fill="#fafafa" stroke="#444"/><text x="145" y="428" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Repeat at n≥30/40/50 and inspect Pearson residuals without individual significance claims.</text></svg>